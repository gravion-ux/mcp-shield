name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests with coverage
        run: python -m pytest -q --cov=mcp_shield --cov-report=xml --cov-fail-under=90
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Smoke-test the CLI
        run: |
          mcp-shield --help
          # The bundled example is deliberately risky: the audit must flag it.
          if mcp-shield audit --config examples/risky-config.json --tools examples/risky-tools.json --format json > /tmp/report.json; then
            echo "ERROR: risky example unexpectedly passed the audit"
            exit 1
          fi
          python -c "import json; r = json.load(open('/tmp/report.json')); assert r['risk_score'] > 0 and r['findings']; print('example findings:', len(r['findings']))"
