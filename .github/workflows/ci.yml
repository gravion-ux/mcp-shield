name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q
      - name: Smoke-test the CLI
        run: |
          mcp-shield --help
          # The bundled example is deliberately risky: the audit must flag it.
          if mcp-shield audit --config examples/risky-config.json --tools examples/risky-tools.json --format json > /tmp/report.json; then
            echo "ERROR: risky example unexpectedly passed the audit"
            exit 1
          fi
          python -c "import json; r = json.load(open('/tmp/report.json')); assert r['risk_score'] > 0 and r['findings']; print('example findings:', len(r['findings']))"
