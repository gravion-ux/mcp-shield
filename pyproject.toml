[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-shield"
version = "0.1.0"
description = "Defensive security auditor for MCP server configurations and tool definitions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Priyanshu Kumar Thakur" },
]
keywords = ["mcp", "model-context-protocol", "security", "audit", "ai", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
# Runtime dependencies: none. mcp-shield uses only the Python standard library.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4"]

[project.scripts]
mcp-shield = "mcp_shield.cli:main"

[project.urls]
Homepage = "https://github.com/gravion-ux/mcp-shield"
Repository = "https://github.com/gravion-ux/mcp-shield"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
